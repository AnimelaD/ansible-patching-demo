---
- name: Multi-tier Patching orchestration Playbook
  hosts: all_servers
  gather_facts: true

  tasks:
    - name: Run Linux Patching tasks
      ansible.builtin.include_role:
        name: patch_linux
      when: ansible_facts['os_family'] == "RedHat"

    - name: Run Windows Patching tasks
      ansible.builtin.include_role:
        name: patch_windows
      when: ansible_facts['os_family'] == "Windows"

      
    